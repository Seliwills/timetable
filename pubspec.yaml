name: timetable_app
description: A personal and school timetable manager with todo, planning board, and notifications.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Local database
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^13.2.0

  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4

  # Drag & drop / reorderable
  flutter_reorderable_list: ^1.0.0

  # Calendar
  table_calendar: ^3.1.0

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  collection: ^1.18.0

  # Icons
  flutter_animate: ^4.5.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
